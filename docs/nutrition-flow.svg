<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 960" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1300" height="960" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
  </marker>
  <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
  </marker>
</defs>
<text x="650.0" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Nutrition Lookup and Calculation — Actual Sequence</text>
<text x="650.0" y="55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">Per-ingredient lookup happens client-side, before the recipe is ever submitted</text>
<rect x="270.0" y="90" width="760" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="294.0" y="114" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">1. User types an ingredient name in the recipe form</text>
<text x="294.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  recipe-form.component.ts: (input) event on the ingredient name field,</text>
<text x="294.0" y="147.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  fires once the name exceeds 2 characters — no debounce on this field</text>
<path d="M 650.0,160 L 650.0,200" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
<rect x="664.0" y="168.8" width="234.8" height="19.6" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="664.0" y="180.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#1d4ed8" text-anchor="start">NutritionService.searchIngredient(name)</text>
<rect x="270.0" y="200" width="760" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="294.0" y="224" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">2. GET /api/nutrition/ingredients/search?ingredient=...</text>
<text x="294.0" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  NutritionController -&gt; NutritionApiService (stateless — no recipe context)</text>
<path d="M 650.0,260 L 650.0,300" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
<rect x="664.0" y="268.8" width="171.9" height="19.6" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="664.0" y="280.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#1d4ed8" text-anchor="start">HTTP Basic Auth, 10s timeout</text>
<rect x="270.0" y="300" width="760" height="70" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
<text x="294.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="start">3. External provider responds, or mock data is used</text>
<text x="294.0" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  real request fails/exceptions -&gt; logged, mock ingredient set returned instead</text>
<text x="294.0" y="357.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  response is per-100g: carbs, fat, protein, calories</text>
<path d="M 650.0,370 L 650.0,410" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="664.0" y="378.8" width="257.6" height="19.6" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="664.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">ingredient nutrition (or null if not found)</text>
<rect x="270.0" y="410" width="760" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="294.0" y="434" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">4. Result cached in the form component&#x27;s memory</text>
<text x="294.0" y="450" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  nutritionInfo[index] — not yet part of the recipe form&#x27;s own controls</text>
<path d="M 650.0,470 L 650.0,510" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="664.0" y="478.8" width="234.8" height="33.2" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="664.0" y="490.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">user repeats for each ingredient, fills</text>
<text x="664.0" y="503.6" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#334155" text-anchor="start">quantities/units, adds steps</text>
<rect x="270.0" y="510" width="760" height="80" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<text x="294.0" y="534" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#854d0e" text-anchor="start">5. On submit: nutrition values are attached to each ingredient</text>
<rect x="810.0" y="524" width="133.2" height="17" rx="8.5" fill="#fef3c7"/>
<text x="876.59" y="536" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle" letter-spacing="0.4">CLIENT-TRUSTED VALUES</text>
<text x="294.0" y="550" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  carbs_per_100g / fat_per_100g / protein_per_100g / calories_per_100g are</text>
<text x="294.0" y="567.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  merged into the payload from step 4&#x27;s cached values (0 if none was found)</text>
<path d="M 650.0,590 L 650.0,630" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
<rect x="664.0" y="598.8" width="251.9" height="19.6" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="664.0" y="610.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#1d4ed8" text-anchor="start">POST /api/recipes or PUT /api/recipes/{id}</text>
<rect x="270.0" y="630" width="760" height="70" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="294.0" y="654" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">6. RecipeController validates and persists</text>
<text x="294.0" y="670" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  Recipe + RecipeIngredients + RecipeSteps written; nutrition fields are</text>
<text x="294.0" y="687.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  stored exactly as submitted — not re-verified against the nutrition provider</text>
<path d="M 650.0,700 L 650.0,740" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrowTeal)"/>
<rect x="664.0" y="708.8" width="171.9" height="19.6" rx="4" fill="#ffffff" fill-opacity="0.95"/>
<text x="664.0" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#0f766e" text-anchor="start">Recipe::calculateNutrition()</text>
<rect x="270.0" y="740" width="760" height="80" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
<text x="294.0" y="764" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#134e4a" text-anchor="start">7. Totals derived from the stored per-ingredient values</text>
<text x="294.0" y="780" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  for each ingredient: (carbs+protein) x 4 kcal/g + fat x 9 kcal/g, scaled by</text>
<text x="294.0" y="797.5" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  quantity/100, summed across all ingredients, rounded to 2 decimals</text>
<path d="M 650.0,820 L 650.0,860" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="270.0" y="860" width="760" height="56" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="294.0" y="884" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">8. Recipe totals returned to the Angular client</text>
<text x="294.0" y="900" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#334155" text-anchor="start">•  displayed on the recipe list/detail view and in client-side average statistics</text>
</svg>